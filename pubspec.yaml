name: lexiflow
description: LexiFlow — Premium offline-first English learning companion (B1→B2).
publish_to: 'none'
version: 2.0.0+11

environment:
  sdk: ^3.5.4

dependencies:
  crypto: 3.0.8
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.7
  sqlite3: ^2.4.6
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2
  intl: ^0.19.0
  uuid: ^4.4.2
  collection: ^1.18.0
  just_audio: ^0.9.40
  audio_session: ^0.1.21
  record: ^5.1.2
  # Newer federated Android releases require a newer Flutter Gradle API.
  record_android: 1.3.1
  record_platform_interface: 1.2.0
  file_picker: ^8.1.2
  permission_handler: ^11.3.1
  pdfx: 2.6.0
  pdf: ^3.11.1
  printing: ^5.13.2
  share_plus: ^10.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  timezone: 0.9.4

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
