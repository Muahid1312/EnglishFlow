name: Build LexiFlow debug APK

on:
  push:
    branches: [lexiflow-2.0-final]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: debug-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out requested revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install pinned Flutter
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch 3.24.5 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = dec2ee5c1f98f8e84a7d5380c05eb8a3d0a81668
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" --version
      - name: Install required Android packages
        shell: bash
        run: |
          set -euo pipefail
          manager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$manager" ]; then
            manager=$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)
          fi
          test -x "$manager"
          "$manager" --sdk_root="$ANDROID_HOME" 'platforms;android-35' 'build-tools;35.0.0' 'ndk;26.1.10909125'
          flutter config --android-sdk "$ANDROID_HOME"
      - name: Validate complete offline content
        id: content
        continue-on-error: true
        run: python3 scripts/validate_content.py 2>&1 | tee content-validation.log
      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile 2>&1 | tee pub-get.log
      # Collect each check's real failure without preventing a debug artifact
      # useful for diagnosis. The final gate fails the job if ANY check failed.
      - name: Check Dart formatting
        id: format
        continue-on-error: true
        run: |
          dart format lib test 2>&1 | tee format.log
          git diff -- lib test > format.patch
          test ! -s format.patch
      - name: Publish formatting diagnostics 1
        if: always()
        run: python3 scripts/ci_diagnostics.py --format-chunks 0:10
      - name: Publish formatting diagnostics 2
        if: always()
        run: python3 scripts/ci_diagnostics.py --format-chunks 10:20
      - name: Publish formatting diagnostics 3
        if: always()
        run: python3 scripts/ci_diagnostics.py --format-chunks 20:30
      - name: Publish formatting diagnostics 4
        if: always()
        run: python3 scripts/ci_diagnostics.py --format-chunks 30:40
      - name: Analyze
        id: analyze
        continue-on-error: true
        run: flutter analyze 2>&1 | tee analyze.log
      - name: Publish full analyzer diagnostic
        if: always()
        run: if [ -f analyze.log ]; then python3 scripts/ci_diagnostics.py --log analyze.log; fi
      - name: Run targeted integrity regressions first
        id: targeted
        continue-on-error: true
        run: flutter test --machine test/phase1_v2_widget_test.dart test/builtin_content_widget_test.dart test/builtin_content_test.dart test/phase5_test.dart test/phase5_widget_test.dart test/backup_v2_test.dart test/database_regression_test.dart test/recovery1_data_test.dart test/daily_plan_v2_test.dart test/study_days_test.dart test/phase4_courses_test.dart test/phase2_ai_test.dart 2>&1 | tee targeted-tests.log
      - name: Publish targeted-tests.log results
        if: always()
        run: |
          if [ -f targeted-tests.log ]; then
            python3 scripts/ci_diagnostics.py --tests targeted-tests.log
            python3 scripts/ci_diagnostics.py --log targeted-tests.log
          fi
      - name: Run full regression suite
        id: tests
        continue-on-error: true
        run: flutter test --machine 2>&1 | tee full-tests.log
      - name: Publish full-tests.log results
        if: always()
        run: |
          if [ -f full-tests.log ]; then
            python3 scripts/ci_diagnostics.py --tests full-tests.log
            python3 scripts/ci_diagnostics.py --log full-tests.log
          fi
      - name: Build debug APK
        if: steps.content.outcome == 'success' && steps.targeted.outcome == 'success'
        id: build
        run: flutter build apk --debug 2>&1 | tee build.log
      - name: Verify actual APK and record metadata
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-debug.apk dist/LexiFlow-2.0.0-build12-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs dist/LexiFlow-2.0.0-build12-debug.apk > dist/signature.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging dist/LexiFlow-2.0.0-build12-debug.apk > dist/package.txt
          grep "package: name='com.lexiflow.lexiflow' versionCode='12' versionName='2.0.0'" dist/package.txt
          python3 scripts/verify_apk_content.py dist/LexiFlow-2.0.0-build12-debug.apk > dist/content-counts.json
          sha256sum dist/LexiFlow-2.0.0-build12-debug.apk > dist/SHA256SUMS.txt
          stat --format='%n %s bytes' dist/LexiFlow-2.0.0-build12-debug.apk > dist/size.txt
          printf '%s\n' 'Debug signed; not a production release.' 'See the workflow check outcomes and docs/BUILTIN_CONTENT_REPORT.md before installing.' > dist/README.txt
      - name: Upload debug APK and verification metadata
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: LexiFlow-2.0.0-build12-debug
          path: dist/
          if-no-files-found: error
          retention-days: 14
      - name: Report verification and enforce the result
        if: always()
        shell: bash
        env:
          CONTENT_RESULT: ${{ steps.content.outcome }}
          FORMAT_RESULT: ${{ steps.format.outcome }}
          ANALYZE_RESULT: ${{ steps.analyze.outcome }}
          TARGETED_RESULT: ${{ steps.targeted.outcome }}
          TEST_RESULT: ${{ steps.tests.outcome }}
          BUILD_RESULT: ${{ steps.build.outcome }}
        run: |
          {
            echo '## Debug APK verification'
            echo 'This workflow does not establish production or physical-device readiness.'
            echo "Content validation: $CONTENT_RESULT"
            echo "Format: $FORMAT_RESULT"
            echo "Analyze: $ANALYZE_RESULT"
            echo "Targeted tests: $TARGETED_RESULT"
            echo "Full tests: $TEST_RESULT"
            echo "Debug APK build: $BUILD_RESULT"
          } >> "$GITHUB_STEP_SUMMARY"
          for logfile in content-validation.log pub-get.log analyze.log targeted-tests.log full-tests.log build.log; do
            if [ -f "$logfile" ]; then
              {
                echo "### $logfile (last 12 KB)"
                echo '```text'
                tail -c 12000 "$logfile"
                echo
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          python3 - <<'PYLOG'
          from pathlib import Path
          for name in ['content-validation.log', 'analyze.log', 'build.log']:
              path = Path(name)
              if not path.is_file():
                  continue
              text = path.read_text(errors='replace')
              if name in ['analyze.log', 'build.log']:
                  excerpt = '\n'.join(line for line in text.splitlines() if __import__('re').search(r'(?:error •|warning •|issues? found|FAILURE|Error:|failed|Built |BUILD )', line))[:3900] or text[-3900:]
              else:
                  markers = [m.start() for m in __import__('re').finditer(r'(?m)^.*(?:❌|FAILED|Expected:|EXCEPTION CAUGHT|Error:|SqliteException).*$', text)]
                  excerpt = '\n\n'.join(text[max(0, pos-100):pos+2500] for pos in markers)[:24000] or text[-12000:]
              escaped = excerpt.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::warning title=CI diagnostic {name}::{escaped}')
          PYLOG
          test "$CONTENT_RESULT" = success
          test "$FORMAT_RESULT" = success
          test "$ANALYZE_RESULT" = success
          test "$TARGETED_RESULT" = success
          test "$TEST_RESULT" = success
          test "$BUILD_RESULT" = success
